name: CD - Despliegue Sprint 1 (sprint1 → Render)

# ════════════════════════════════════════════════════════════
# Despliegue del Sprint 1 en Render.
#
# Se dispara al hacer push a la rama 'sprint1'.
# Construye la imagen Docker full-stack (React + Spring Boot)
# y la publica en GHCR con etiqueta :sprint1.
# Luego dispara un redeploy en Render via Deploy Hook.
#
# Una vez finalizado el sprint, la rama se congela
# (protegida, sin nuevos commits).
#
# Base de datos: Neon (PostgreSQL serverless), configurada
# como variables de entorno en el servicio de Render.
#
# Secretos/variables necesarios (a nivel de repositorio):
#   - secrets.RENDER_DEPLOY_HOOK_URL  → Deploy Hook del servicio en Render
#   - vars.RENDER_SPRINT1_URL         → URL pública (ej: https://meerkatters-sprint1.onrender.com)
# ════════════════════════════════════════════════════════════

on:
  push:
    branches: [sprint1]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# ────────────────────────────────────────────────────────────
jobs:

  deploy:
    name: Desplegar Full-stack (Sprint 1 - Render)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No usa 'environment' — secretos y variables van a nivel de repo

    steps:
      # ── 1. Checkout ──────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Login en GHCR ────────────────────────────────
      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Nombre de imagen en minúsculas ────────────────
      - name: Convertir nombre de imagen a minúsculas
        run: echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> $GITHUB_ENV

      # ── 4. Build y push imagen Docker ────────────────────
      - name: Build y push imagen Docker (Full-stack)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:sprint1
            ${{ env.APP_IMAGE }}:sprint1-${{ github.sha }}
          build-args: |
            REACT_APP_API_URL=${{ vars.RENDER_SPRINT1_URL }}

      # ── 5. Disparar redeploy en Render ───────────────────
      - name: Trigger Render Deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "Deploy hook triggered for Sprint 1 on Render."
