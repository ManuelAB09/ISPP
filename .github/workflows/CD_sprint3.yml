name: CD - Despliegue Sprint 3 (sprint3 -> Azure)

# ════════════════════════════════════════════════════════════
# Despliegue del Sprint 3 en Azure App Service.
#
# Se ejecuta cuando el workflow de CI completa con éxito
# para la rama sprint3.
#
# Despliega full-stack (React + Spring Boot) en una sola Web App
# usando imagen Docker publicada en GHCR.
#
# Secretos/variables necesarios:
#   - secrets.AZURE_CREDENTIALS
#   - vars.AZURE_WEBAPP_SPRINT3
# ════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["CI - Integración Continua"]
    branches: [sprint3]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Desplegar Full-stack (Sprint 3)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: sprint3

    steps:
      - name: Checkout (commit que disparó el CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de imagen a minúsculas
        run: echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> $GITHUB_ENV

      - name: Build y push imagen Docker (Full-stack)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:sprint3
            ${{ env.APP_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure App Service (Sprint 3)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_SPRINT3 }}
          images: ${{ env.APP_IMAGE }}:${{ github.event.workflow_run.head_sha }}
