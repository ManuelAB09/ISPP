name: CD - Despliegue Staging (develop → Azure)

# ════════════════════════════════════════════════════════════
# CONFIGURACIÓN OPTIMIZADA PARA ESTUDIANTES
# 
# Se ejecuta cuando el workflow de CI completa con éxito
# en la rama develop. Despliega:
#   - Full-stack: React + Spring Boot en una sola Web App
#
# El Dockerfile multi-stage compila React y lo embebe como
# recursos estáticos dentro del JAR de Spring Boot.
# → Una sola URL, sin CORS, sin Static Web Apps.
#
# B1 NO soporta deployment slots — usamos 2 Web Apps en el
# MISMO App Service Plan B1 (~€11/mes):
#   - Producción: meerkatters           (Web App con Always On)
#   - Staging:    meerkatters-stg       (Web App con Always On)
#
# Coste mensual estimado: ~€23.50 (1 plan B1 + PostgreSQL B1ms)
# ════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["CI - Integración Continua"]
    branches: [develop]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# ────────────────────────────────────────────────────────────
jobs:

  # ──────────────────────────────────────────
  # Desplegar Full-stack (Web App Staging - B1)
  # ──────────────────────────────────────────
  deploy:
    name: Desplegar Full-stack (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: staging

    steps:
      - name: Checkout (commit que disparó el CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de imagen a minúsculas
        run: echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> $GITHUB_ENV

      - name: Build y push imagen Docker (Full-stack)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            REACT_APP_STRIPE_PUBLIC_KEY=${{ secrets.REACT_APP_STRIPE_PUBLIC_KEY }}
          tags: |
            ${{ env.APP_IMAGE }}:staging
            ${{ env.APP_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure App Service (Staging)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_STG }}
          images: ${{ env.APP_IMAGE }}:${{ github.event.workflow_run.head_sha }}
