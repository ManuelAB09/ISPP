name: CD - Despliegue Sprint PPL (sprintPPL -> Azure)

# ════════════════════════════════════════════════════════════
# Despliegue del Sprint PPL en Azure App Service.
#
# Se ejecuta con push a la rama sprintPPL.
#
# Despliega full-stack (React + Spring Boot) en una sola Web App
# usando imagen Docker publicada en GHCR.
#
# Secretos/variables necesarios:
#   - secrets.AZURE_CREDENTIALS
#   - secrets.REACT_APP_STRIPE_PUBLIC_KEY
#   - vars.AZURE_WEBAPP_SPRINTPPL
# ════════════════════════════════════════════════════════════

on:
  push:
    branches: [sprintPPL]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  deploy:
    name: Desplegar Full-stack (Sprint PPL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: sprintPPL

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de imagen a minúsculas
        run: echo "APP_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/app" >> $GITHUB_ENV

      - name: Build y push imagen Docker (Full-stack)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            REACT_APP_STRIPE_PUBLIC_KEY=${{ secrets.REACT_APP_STRIPE_PUBLIC_KEY }}
          tags: |
            ${{ env.APP_IMAGE }}:sprintppl
            ${{ env.APP_IMAGE }}:${{ github.sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure App Service (Sprint PPL)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_SPRINTPPL }}
          images: ${{ env.APP_IMAGE }}:${{ github.sha }}
