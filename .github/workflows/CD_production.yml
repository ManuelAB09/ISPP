name: CD - Despliegue Producción (main → Azure)

# ════════════════════════════════════════════════════════════
# CONFIGURACIÓN OPTIMIZADA PARA ESTUDIANTES
# 
# Se ejecuta cuando el workflow de CI completa con éxito
# en la rama main. Despliega:
#   - Backend: Web App producción (B1 Basic, Always On habilitado)
#   - Frontend: Azure Static Web Apps (GRATIS)
#
# B1 NO soporta deployment slots — usamos 2 Web Apps en el
# MISMO App Service Plan B1 (~€11/mes):
#   - Producción: Web App con Always On
#   - Staging:    Web App con Always On
#
# Ambas comparten 1 vCPU + 1.75 GB RAM. Si resulta
# insuficiente, escalar a B2 (~€22/mes, 2 vCPU, 3.5 GB).
#
# Coste mensual estimado: ~€23.50 (1 plan B1 + PostgreSQL B1ms)
# ════════════════════════════════════════════════════════════

on:
  workflow_run:
    workflows: ["CI - Integración Continua"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

# ────────────────────────────────────────────────────────────
jobs:

  # ──────────────────────────────────────────
  # Desplegar Backend (Web App Producción - B1 + Always On)
  # ──────────────────────────────────────────
  deploy-backend:
    name: Desplegar Backend (Producción)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout (commit que disparó el CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Login en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Convertir nombre de imagen a minúsculas
        run: echo "BACKEND_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/backend" >> $GITHUB_ENV

      - name: Build y push imagen Docker (Backend)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}

      - name: Login en Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar en Azure App Service (Producción)
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_BACKEND_APP }}
          images: ${{ env.BACKEND_IMAGE }}:${{ github.event.workflow_run.head_sha }}

  # ──────────────────────────────────────────
  # Desplegar Frontend (Static Web Apps - GRATIS)
  # ──────────────────────────────────────────
  deploy-frontend:
    name: Desplegar Frontend (Static Web Apps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: production

    steps:
      - name: Checkout (commit que disparó el CI)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Build del frontend
        working-directory: frontend
        env:
          REACT_APP_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: npm run build

      - name: Desplegar en Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN_PRODUCTION }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/frontend"
          output_location: "build"
          skip_app_build: true
