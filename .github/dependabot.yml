# ═══════════════════════════════════════════════════════
# Dependabot — Actualización automática de dependencias
# ═══════════════════════════════════════════════════════
#
# Estrategia de agrupación:
#   - minor + patch → 1 PR agrupado por ecosistema (auto-mergeable si CI ✅)
#   - major         → PR individual por dependencia (requiere revisión manual)
# ═══════════════════════════════════════════════════════

version: 2
updates:
  # Maven (backend)
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build(deps)"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm (frontend)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(deps)"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
