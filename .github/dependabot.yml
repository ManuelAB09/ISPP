# ═══════════════════════════════════════════════════════
# Dependabot — DESACTIVADO TEMPORALMENTE
# ═══════════════════════════════════════════════════════
# Para reactivar: descomentar todo el bloque "version: 2" / "updates:"
# y quitar el open-pull-requests-limit: 0.
# ═══════════════════════════════════════════════════════
#
# Estrategia de agrupación (cuando esté activo):
#   - minor + patch → 1 PR agrupado por ecosistema (auto-mergeable si CI ✅)
#   - major         → PR individual por dependencia (requiere revisión manual)
# ═══════════════════════════════════════════════════════

version: 2
updates:
  # Maven (backend) — DESACTIVADO
  - package-ecosystem: "maven"
    directory: "/backend"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # ← desactiva sin borrar config
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "build(deps)"
    groups:
      backend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm (frontend) — DESACTIVADO
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # ← desactiva sin borrar config
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "build(deps)"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — DESACTIVADO
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "trunk"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0  # ← desactiva sin borrar config
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
