# ═══════════════════════════════════════════════════
#  Perfil SPRINT2 — Render + Neon (PostgreSQL serverless)
#
#  Activar con: SPRING_PROFILES_ACTIVE=sprint2
#  Las variables se configuran en Render Dashboard
#  → Environment → Environment Variables
#
#  Base de datos: Neon (instancia dedicada al Sprint 2)
# ═══════════════════════════════════════════════════

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        validator:
          apply_to_ddl: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}
  tomcat:
    threads:
      max: 10
      min-spare: 2
    max-connections: 30
    accept-count: 5

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: WARN
    es.us.meerkat: INFO

# ── CORS: orígenes permitidos para este entorno ──
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://meerkatters-sprint2.onrender.com}
