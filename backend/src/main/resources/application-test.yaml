# ═══════════════════════════════════════════════════
#  Perfil TEST — PostgreSQL en contenedor Docker (CI)
#
#  Activar con: SPRING_PROFILES_ACTIVE=test
#  Usado por el job test-backend del CI (CI.yml):
#    - SPRING_DATASOURCE_URL   → postgres en localhost:5432
#    - SPRING_DATASOURCE_USERNAME → meerkatters_user
#    - SPRING_DATASOURCE_PASSWORD → meerkatters_password
# ═══════════════════════════════════════════════════

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

server:
  port: 8080

google:
  classroom:
    client-id: ${GOOGLE_CLASSROOM_CLIENT_ID:test-client-id}
    client-secret: ${GOOGLE_CLASSROOM_CLIENT_SECRET:test-client-secret}
    redirect-uri: ${GOOGLE_CLASSROOM_REDIRECT_URI:http://localhost:8080/oauth2/callback/google-classroom}
stripe:
  api:
    key: stripe.api.key
  webhook:
    secret: stripe.webhook.secret
  success: 
    url: http://localhost:3000/success
  cancel:
    url: http://localhost:3000/cancel
  price:
    premium: prod_U3x4AB7AnO2JPG
