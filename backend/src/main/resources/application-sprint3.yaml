# ═══════════════════════════════════════════════════
#  Perfil SPRINT3 — Azure App Service + PostgreSQL
#
#  Activar con: SPRING_PROFILES_ACTIVE=sprint3
#  Las variables se configuran en Azure App Service
#  → Configuration → Application Settings
# ═══════════════════════════════════════════════════

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  port: 8080

logging:
  level:
    root: INFO
    es.us.meerkat: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://meerkatters-sprint3.azurewebsites.net}
