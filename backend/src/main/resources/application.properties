spring.profiles.active=local
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:3000/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:3000/cancel}
stripe.price.premium=${STRIPE_PRICE_PREMIUM:prod_U3x4AB7AnO2JPG}

# Google Classroom - local dev defaults
google.classroom.client-id=${GOOGLE_CLASSROOM_CLIENT_ID:placeholder}
google.classroom.client-secret=${GOOGLE_CLASSROOM_CLIENT_SECRET:placeholder}


# ============================================================
# Configuración de correo — añadir a application.properties
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=meerkattersapp@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.from=meerkattersapp@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.url=http://localhost:3000
app.name=Meerkat
