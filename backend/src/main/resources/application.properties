spring.profiles.active=local

# Stripe
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.success.url=${STRIPE_SUCCESS_URL:http://localhost:3000/success}
stripe.cancel.url=${STRIPE_CANCEL_URL:http://localhost:3000/cancel}
stripe.price.premium=${STRIPE_PRICE_PREMIUM:prod_U3x4AB7AnO2JPG}

# Google
google.classroom.client-id=${GOOGLE_CLASSROOM_CLIENT_ID:placeholder}
google.classroom.client-secret=${GOOGLE_CLASSROOM_CLIENT_SECRET:placeholder}
google.classroom.redirect-uri=${GOOGLE_CLASSROOM_REDIRECT_URI:http://localhost:8080/oauth2/callback/google-classroom}
google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:}
google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:}
google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/google-calendar/oauth/callback}

# Mail
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:${EMAIL:meerkattersauth@gmail.com}}
spring.mail.password=${MAIL_PASSWORD:${PASSWORD_EMAIL:}}
spring.mail.from=${MAIL_FROM:${MAIL_USERNAME:${EMAIL:meerkattersauth@gmail.com}}}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_SMTP_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# App
app.frontend.url=${FRONTEND_URL:http://localhost:3000}
app.name=Meerkat

# Database / JPA (perfil local)
# Evita conflictos con variables globales SPRING_DATASOURCE_* en .env
spring.datasource.url=${LOCAL_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meerkatters}
spring.datasource.username=${LOCAL_DATASOURCE_USERNAME:meerkatters_user}
spring.datasource.password=${LOCAL_DATASOURCE_PASSWORD:meerkatters_password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect