# ═══ Configuración por defecto ═══
spring.application.name=meerkatters

# Base de datos H2 en memoria para desarrollo (cambiar a PostgreSQL en producción)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:meerkatters;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ═══ SpringDoc OpenAPI / Swagger ═══
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
# Usar el archivo openapi.yaml externo en lugar de generar desde controladores
springdoc.swagger-ui.url=/openapi.yaml
