# ═══ Configuración por defecto ═══
spring.application.name=meerkatters

# Base de datos (se sobreescribe por perfil/variables de entorno)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meerkatters}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meerkatters_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meerkatters_password}
spring.jpa.hibernate.ddl-auto=update
