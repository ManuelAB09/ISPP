spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ── configuración por defecto: PostgreSQL (usa variables de entorno) ──
# En Azure se activa "staging" o "production" via SPRING_PROFILES_ACTIVE
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meerkatters}
    username: ${SPRING_DATASOURCE_USERNAME:meerkatters_user}
    password: ${SPRING_DATASOURCE_PASSWORD:meerkatters_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ── CONFIGURACIÓN EMAIL ──
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL}
    password: ${PASSWORD_EMAIL}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIG1lZXJrYXQgYmFja2VuZCBqd3Q=
  expiration: 86400000

google:
  classroom:
    client-id: ${GOOGLE_CLASSROOM_CLIENT_ID}
    client-secret: ${GOOGLE_CLASSROOM_CLIENT_SECRET}
    redirect-uri: ${GOOGLE_CLASSROOM_REDIRECT_URI:http://localhost:8080/oauth2/callback/google-classroom}

zoom:
  client-id: ${ZOOM_CLIENT_ID:}
  client-secret: ${ZOOM_CLIENT_SECRET:}
  account-id: ${ZOOM_ACCOUNT_ID:}
  webhook-secret-token: ${ZOOM_WEBHOOK_SECRET_TOKEN:}
  api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
  recordings:
    storage-mode: ${ZOOM_RECORDINGS_STORAGE_MODE:local}
    storage-path: ${ZOOM_RECORDINGS_STORAGE_PATH:storage/zoom-recordings}
    retention-days: ${ZOOM_RECORDINGS_RETENTION_DAYS:30}
    cleanup-cron: ${ZOOM_RECORDINGS_CLEANUP_CRON:0 0 3 * * *}
    supabase:
      url: ${ZOOM_RECORDINGS_SUPABASE_URL:}
      service-role-key: ${ZOOM_RECORDINGS_SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${ZOOM_RECORDINGS_SUPABASE_BUCKET:zoom-recordings}


# perfil especial para arrancar con H2 cuando se quiera
---
spring:
  config.activate.on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG

# ── PROPIEDADES PERSONALIZADAS ──
mail:
  from: ${EMAIL}

app:
  name: Meerkat

springdoc:
  swagger-ui:
    urls:
      - name: Dynamic
        url: /v3/api-docs
      - name: Static
        url: /spec/openapi.yaml
    oauth:
      enabled: false
  api-docs:
    enabled: true