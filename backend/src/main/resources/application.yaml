spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:50MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:50MB}

# ── configuración por defecto: PostgreSQL (usa variables de entorno) ──
# En Azure se activa "staging" o "production" via SPRING_PROFILES_ACTIVE
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meerkatters}
    username: ${SPRING_DATASOURCE_USERNAME:meerkatters_user}
    password: ${SPRING_DATASOURCE_PASSWORD:meerkatters_password}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

# ── CONFIGURACIÓN EMAIL ──

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:${EMAIL:meerkattersauth@gmail.com}}
    password: ${MAIL_PASSWORD:${PASSWORD_EMAIL:changeme}}
    from: ${MAIL_FROM:${MAIL_USERNAME:${EMAIL:meerkattersauth@gmail.com}}}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
            required: ${MAIL_SMTP_STARTTLS_REQUIRED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

sendgrid:
  api-key: ${SENDGRID_API_KEY:}

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIG1lZXJrYXQgYmFja2VuZCBqd3Q=}
  expiration: ${JWT_EXPIRATION:86400000}

# ── CONFIGURACIÓN APP ──
app:
  name: MeerKatters
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

stripe:
  api:
    key: ${STRIPE_API_KEY:sk_test_placeholder}
  webhook:
    secret: ${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
  success:
    url: ${STRIPE_SUCCESS_URL:http://localhost:3000/success}
  cancel:
    url: ${STRIPE_CANCEL_URL:http://localhost:3000/cancel}
  price:
    premium: ${STRIPE_PRICE_PREMIUM:prod_U3x4AB7AnO2JPG}

google:
  classroom:
    client-id: ${GOOGLE_CLASSROOM_CLIENT_ID:placeholder}
    client-secret: ${GOOGLE_CLASSROOM_CLIENT_SECRET:placeholder}
    redirect-uri: ${GOOGLE_CLASSROOM_REDIRECT_URI:http://localhost:8080/oauth2/callback/google-classroom}
  calendar:
    client-id: ${GOOGLE_CALENDAR_CLIENT_ID:placeholder}
    client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:placeholder}
    redirect-uri: ${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/api/v1/google-calendar/oauth/callback}

zoom:
  client-id: ${ZOOM_CLIENT_ID:}
  client-secret: ${ZOOM_CLIENT_SECRET:}
  account-id: ${ZOOM_ACCOUNT_ID:}
  webhook-secret-token: ${ZOOM_WEBHOOK_SECRET_TOKEN:}
  api-base-url: ${ZOOM_API_BASE_URL:https://api.zoom.us/v2}
  recordings:
    storage-mode: ${ZOOM_RECORDINGS_STORAGE_MODE:local}
    storage-path: ${ZOOM_RECORDINGS_STORAGE_PATH:storage/zoom-recordings}
    retention-days: ${ZOOM_RECORDINGS_RETENTION_DAYS:30}
    cleanup-cron: ${ZOOM_RECORDINGS_CLEANUP_CRON:0 0 3 * * *}
    supabase:
      url: ${ZOOM_RECORDINGS_SUPABASE_URL:}
      service-role-key: ${ZOOM_RECORDINGS_SUPABASE_SERVICE_ROLE_KEY:}
      bucket: ${ZOOM_RECORDINGS_SUPABASE_BUCKET:zoom-recordings}

oauth:
  redirect-uri-login: ${OAUTH_REDIRECT_URI_LOGIN:http://localhost:8080/api/v1/auth/google/callback}


