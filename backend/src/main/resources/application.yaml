spring:
  
  security:
    user:
      name: admin
      password: admin123
  application:
    name: backend

  # ── Perfil por defecto: H2 en memoria (desarrollo local) ──
  # En Azure se activa "staging" o "production" via SPRING_PROFILES_ACTIVE
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080

springdoc:
  swagger-ui:
    urls:
      - name: Dynamic
        url: /v3/api-docs
      - name: Static
        url: /spec/openapi.yaml
    urls-primary-name: Dynamic
  api-docs:
    enabled: true
