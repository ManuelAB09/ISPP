spring:
  
  security:
    user:
      name: admin
      password: admin123
  application:
    name: backend

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  springdoc:
    swagger-ui:
      urls:
        - name: Dynamic
          url: /v3/api-docs
        - name: Static
          url: /spec/openapi.yaml
      oauth:
        enabled: false
    api-docs:
      enabled: true
