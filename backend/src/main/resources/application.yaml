spring:
  application:
    name: backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# ── configuración por defecto: PostgreSQL (usa variables de entorno) ──
# En Azure se activa "staging" o "production" via SPRING_PROFILES_ACTIVE
  datasource:
    url:      ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meerkatters}
    username: ${SPRING_DATASOURCE_USERNAME:meerkatters_user}
    password: ${SPRING_DATASOURCE_PASSWORD:meerkatters_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ── CONFIGURACIÓN EMAIL ──
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL:test@example.com}
    password: ${PASSWORD_EMAIL:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

jwt:
  secret: dGhpcyBpcyBhIHNlY3JldCBrZXkgZm9yIG1lZXJrYXQgYmFja2VuZCBqd3Q=
  expiration: 86400000


# perfil especial para arrancar con H2 cuando se quiera
---
spring:
  config.activate.on-profile: h2

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.mail: DEBUG

# ── PROPIEDADES PERSONALIZADAS ──
mail:
  from: ${EMAIL:test@example.com}

app:
  name: Meerkat

springdoc:
  swagger-ui:
    urls:
      - name: Dynamic
        url: /v3/api-docs
      - name: Static
        url: /spec/openapi.yaml
    oauth:
      enabled: false
  api-docs:
    enabled: true