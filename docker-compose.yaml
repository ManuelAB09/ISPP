version: "3.9"
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meerkatters
      POSTGRES_USER: meerkatters_user
      POSTGRES_PASSWORD: meerkatters_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/meerkatters
      SPRING_DATASOURCE_USERNAME: meerkatters_user
      SPRING_DATASOURCE_PASSWORD: meerkatters_password
    depends_on:
      - postgres

volumes:
  pgdata:
